<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting — AppsBuiltWithAI</title>
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="0; url=https://app.appsbuiltwithai.com/signin" />
  <link rel="canonical" href="https://app.appsbuiltwithai.com/signin" />
  <script>
    var url = "https://app.appsbuiltwithai.com/signin" + window.location.search + window.location.hash;
    try { (window.top !== window.self ? window.top : window).location.replace(url); } catch (error) { window.location.replace(url); }
  </script>
</head>
<body>
  <p><a href="https://app.appsbuiltwithai.com/signin" target="_top">Continue to AppsBuiltWithAI</a></p>
</body>
</html>
