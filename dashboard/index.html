<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AppsBuiltWithAI — Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    #__err { display:none; position:fixed; left:16px; right:16px; top:16px; z-index:9999; background:#1F1A2E; color:#FAF5EA; border-radius:12px; padding:16px 18px; font:13px/1.5 ui-monospace,monospace; white-space:pre-wrap; box-shadow:0 24px 64px -16px rgba(0,0,0,.4); }
    @keyframes dot { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <pre id="__err"></pre>

  <script>
    window.addEventListener("error",(e)=>{var b=document.getElementById("__err");if(b){b.style.display="block";b.textContent="Error: "+(e.error&&e.error.stack?e.error.stack:e.message);}});
    window.addEventListener("unhandledrejection",(e)=>{var b=document.getElementById("__err");if(b){b.style.display="block";b.textContent="Unhandled: "+(e.reason&&e.reason.stack?e.reason.stack:String(e.reason));}});
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="pages-invites.jsx"></script>
  <script type="text/babel" src="pages-home.jsx"></script>
  <script type="text/babel" src="pages-editor.jsx"></script>
  <script type="text/babel" src="pages-templates-analytics.jsx"></script>
  <script type="text/babel" src="pages-settings.jsx"></script>
  <script type="text/babel" src="pages-plan.jsx"></script>
  <script type="text/babel" src="pages-security.jsx"></script>
  <script type="text/babel" src="pages-testing.jsx"></script>
  <script type="text/babel" src="pages-launch.jsx"></script>
  <script type="text/babel" src="pages-marketing.jsx"></script>
  <script type="text/babel" src="pages-connectors.jsx"></script>
  <script type="text/babel" src="pages-data.jsx"></script>
  <script type="text/babel" src="pages-support.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
