<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Waitlist — AppsBuiltWithAI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&family=Roboto+Serif:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="waitlist.css" />
</head>
<body>
  <div id="root"></div>
  <pre id="__err" style="display:none;position:fixed;left:16px;right:16px;top:16px;z-index:9999;background:#1F1A2E;color:#FAF5EA;border-radius:12px;padding:16px 18px;font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;"></pre>
  <script>
    window.addEventListener("error",(e)=>{var b=document.getElementById("__err");if(b){b.style.display="block";b.textContent="Error: "+(e.error&&e.error.stack?e.error.stack:e.message);}});
    window.addEventListener("unhandledrejection",(e)=>{var b=document.getElementById("__err");if(b){b.style.display="block";b.textContent="Unhandled: "+(e.reason&&e.reason.stack?e.reason.stack:String(e.reason));}});
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="waitlist-page.jsx"></script>
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<window.WaitlistVariations/>);
  </script>
</body>
</html>
